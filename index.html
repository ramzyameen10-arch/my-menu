<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة بوابة الدفع Paddle v2</title>
    
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>

    <div style="text-align: center; margin-top: 100px;">
        <h2>الاشتراك في الخطة الاحترافية (Pro Monthly) - v2</h2>
        <p>السعر: 10 دولار شهرياً</p>
        <button id="checkout-btn" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #2b6cb0; color: white; border: none; border-radius: 5px;">
            اشترك الآن
        </button>
    </div>

    <script>
        // 2. طريقة التهيئة الرسمية الخاصة بإصدار v2
        Paddle.Environment.set("sandbox");
        
        // في v2 نستخدم معرف البائع (Vendor ID) الرقمي بدلاً من الـ Token
        // يرجى استبدال 12345 بمعرّف البائع الخاص بك من لوحة تحكم Paddle v2 إذا كان مختلفاً
        Paddle.Setup({ 
            vendor: 12345 
        });

        // 3. ربط حدث الضغط على الزر باستدعاء Checkout الخاص بـ v2
        document.getElementById('checkout-btn').addEventListener('click', function() {
            Paddle.Checkout.open({
                product: 'pri_01kx2wv065vft9k5yn3r0xh3a4', // معرف المنتج/السعر الخاص بك
                method: 'get'
            });
        });
    </script>

</body>
</html>
