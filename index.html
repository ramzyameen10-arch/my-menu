<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تجار رمزي - دخول</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        
        /* تنسيق الهيدر */
        .profile-header { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .profile-header h2 { margin: 0; font-size: 1.4rem; color: #333; }

        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .timer-text { font-size: 0.9rem; color: #666; margin-top: 10px; }
        #resend-link { color: #007bff; cursor: pointer; display: none; text-decoration: underline; margin-top: 10px; font-size: 0.9rem; }
        #step-2 { display: none; }
    </style>
<base target="_blank">
</head>
<body>

<div class="card">
    <div id="step-1">
        <div class="profile-header">
            <h2>منصة تجار رمزي</h2>
        </div>
        
        <p>أدخل رقم الواتساب</p>
        <input type="tel" id="phone" placeholder="9665XXXXXXXX" value="966552806414">
        <button id="send-btn" onclick="requestOTP()">إرسال كود التحقق</button>
    </div>

    <div id="step-2">
        <div class="profile-header">
            <h2>تحقق من الرمز</h2>
        </div>
        <p id="target-phone"></p>
        <input type="number" id="otp" placeholder="أدخل الكود المكون من 4 أرقام">
        <button id="verify-btn" onclick="verifyOTP()">تأكيد الدخول</button>
        
        <div class="timer-text" id="timer-container">يمكنك إعادة الإرسال خلال: <span id="seconds">60</span> ثانية</div>
        <div id="resend-link" onclick="requestOTP()">إعادة إرسال الكود؟</div>
        
        <p style="color:red; cursor:pointer; margin-top:20px;" onclick="location.reload()">تغيير الرقم</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="global.js"></script>

<script>
    // ============================================================
    // ✅ عميل Supabase وآليات المصادقة (checkAuth/logout) أصبحت موحّدة
    //    وتُستمد من global.js لتفادي التكرار والتعارض بين الصفحات.
    //    (getSupabaseClient, checkAuth, logout)
    // ============================================================
    let timerInterval;

    function startTimer() {
        let timeLeft = 60;
        const secondsSpan = document.getElementById('seconds');
        const timerContainer = document.getElementById('timer-container');
        const resendLink = document.getElementById('resend-link');

        timerContainer.style.display = 'block';
        resendLink.style.display = 'none';

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            secondsSpan.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerContainer.style.display = 'none';
                resendLink.style.display = 'block';
            }
        }, 1000);
    }

    async function requestOTP() {
        const phone = document.getElementById('phone').value.trim();
        const btn = document.getElementById('send-btn');
        
        if (!phone) return alert("الرجاء إدخال الرقم");

        btn.disabled = true;
        btn.innerText = "جاري التحقق والإرسال...";

        try {
            const sb = getSupabaseClient(); // ← من global.js

            // 1. محاولة إضافة الرقم أولاً في جدول auth.users من خلال دالة الـ RPC الأمنة
            const { data: createData, error: createError } = await sb.rpc('admin_create_user_by_phone', { input_phone: phone });
            
            if (createError) {
                console.error("خطأ أثناء تسجيل المستخدم أو التحقق منه:", createError);
            }

            // 2. إرسال كود التحقق OTP (سواء كان المستخدم جديد وتم إنشاؤه أو موجود مسبقاً)
            const { error: otpError } = await sb.rpc('request_whatsapp_otp', { input_phone: phone });
            if (otpError) throw otpError;

            // الانتقال للخطوة الثانية
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
            document.getElementById('target-phone').innerText = "تم الإرسال إلى: " + phone;
            document.getElementById('otp').value = ""; 
            
            startTimer();

        } catch (err) {
            alert("خطأ: " + err.message);
            btn.disabled = false;
            btn.innerText = "إعادة المحاولة";
        }
    }

    async function verifyOTP() {
        const code = document.getElementById('otp').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const btn = document.getElementById('verify-btn');

        if (!code) return alert("أدخل الكود أولاً");
        btn.disabled = true;
        btn.innerText = "جاري التحقق...";

        try {
            // ✅ استدعاء Edge Function مباشرة (التحقق كله في الخادم)
            const response = await fetch(
                'https://wnvyqvwuzmxzzhilgidh.supabase.co/functions/v1/auth-session',
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, otpCode: code })
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'فشل التحقق');
            }

            // ✅ تخزين JWT Token
            localStorage.setItem('auth_token', result.token);
            localStorage.setItem('user_phone_display', phone);
            localStorage.setItem('is_logged_in', 'true');
            localStorage.removeItem('user_phone'); // حذف القديم

            window.location.href = "dashboard.html";

        } catch (err) {
            console.error('Verification error:', err);
            alert("فشل التحقق: " + err.message);
            btn.disabled = false;
            btn.innerText = "تأكيد الدخول";
        }
    }

    // ملاحظة: دالتا checkAuth() و logout() لهذه الصفحة تأتيان الآن
    // من global.js مباشرة (بدون تعريف محلي مكرر هنا) لضمان توحيد
    // آلية المصادقة عبر كل صفحات الموقع.
</script>
</body>
</html>
