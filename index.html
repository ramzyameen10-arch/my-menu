<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة بوابة الدفع Paddle</title>
    <script src="paddle.js"></script>
</head>
<body>

    <div style="text-align: center; margin-top: 100px;">
        <h2>الاشتراك في الخطة الاحترافية (Pro Monthly)</h2>
        <p>السعر: 10 دولار شهرياً</p>
        <button id="checkout-btn" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #2b6cb0; color: white; border: none; border-radius: 5px;">
            اشترك الآن
        </button>
    </div>

    <script>
        // دالة الفحص لضمان استقرار السكربت في المتصفح قبل التهيئة
        function initPaddleSecure() {
            if (typeof Paddle !== 'undefined') {
                
                // ضبط بيئة العمل التجريبية والتوكن الخاص بك
                Paddle.Environment.set("sandbox");
                Paddle.Setup({ 
                    token: 'test_2cc3d344a1d0e4e6d616fd1cafd' 
                });

                // تفعيل حدث الضغط على زر الشراء
                document.getElementById('checkout-btn').addEventListener('click', function() {
                    Paddle.Checkout.open({
                        items: [
                            {
                                priceId: 'pri_01kx2wv065vft9k5yn3r0xh3a4', 
                                quantity: 1
                            }
                        ],
                        settings: {
                            displayMode: 'overlay',
                            theme: 'light',
                            locale: 'en'
                        }
                    });
                });

                console.log("تم تفعيل Paddle بنجاح والزر جاهز للاستخدام!");
            } else {
                // المحاولة مجدداً بعد 100 ملي ثانية في حال تأخر الاستجابة
                setTimeout(initPaddleSecure, 100);
            }
        }

        // بدء الفحص الذاتي
        initPaddleSecure();
    </script>

</body>
</html>
