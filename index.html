<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة بوابة الدفع Paddle</title>
    <script src="https://cdn.paddle.com/paddle/v3/paddle.js"></script>
</head>
<body>

    <div style="text-align: center; margin-top: 100px;">
        <h2>الاشتراك في الخطة الاحترافية (Pro Monthly)</h2>
        <p>السعر: 10 دولار شهرياً</p>
        <button id="checkout-btn" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #2b6cb0; color: white; border: none; border-radius: 5px;">
            اشترك الآن
        </button>
    </div>

    <script>
        // تهيئة بيئة العمل والتوافق المباشر
        Paddle.Environment.set("sandbox");
        
        Paddle.Setup({ 
            token: 'test_2cc3d344a1d0e4e6d616fd1cafd' // التوكن الخاص بك
        });

        // تشغيل حدث الضغط على الزر مباشرة
        document.getElementById('checkout-btn').addEventListener('click', function() {
            // تنبيه بسيط للتأكد من استجابة الزر في المتصفح
            console.log("تم الضغط على الزر بنجاح، جاري استدعاء نافذة Paddle...");
            
            Paddle.Checkout.open({
                items: [
                    {
                        priceId: 'pri_01kx2wv065vft9k5yn3r0xh3a4', // معرّف السعر الخاص بك
                        quantity: 1
                    }
                ],
                settings: {
                    displayMode: 'overlay',
                    theme: 'light',
                    locale: 'en'
                }
            });
        });
    </script>

</body>
</html>
