<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة بوابة الدفع Paddle</title>

    <!--
        الرابط الرسمي المعتمد من توثيق Paddle الرسمي (developer.paddle.com/paddlejs/include-paddlejs)
        دائمًا حمّل Paddle.js مباشرة من cdn.paddle.com لضمان الحصول على آخر تحديثات الأمان والميزات تلقائيًا.
        لا تقم بتنزيل هذا الملف ووضعه محليًا في مشروعك، فهذا يفقدك التحديثات الأمنية المستمرة من Paddle.
    -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 100px;">
        <h2>الاشتراك في الخطة الاحترافية (Pro Monthly)</h2>
        <p>السعر: 10 دولار شهرياً</p>
        <button id="checkout-btn" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #2b6cb0; color: white; border: none; border-radius: 5px;">
            اشترك الآن
        </button>
        <p id="status-msg" style="margin-top: 15px; color: #718096; font-size: 14px;"></p>
    </div>

    <script type="text/javascript">
        var statusEl = document.getElementById('status-msg');

        // التحقق من وصول مكتبة Paddle فعلياً قبل أي إعداد
        if (typeof Paddle === 'undefined') {
            statusEl.textContent = 'تعذّر تحميل مكتبة الدفع. يرجى تحديث الصفحة أو المحاولة لاحقاً.';
            statusEl.style.color = '#e53e3e';
        } else {
            // التهيئة حسب التوثيق الرسمي: Paddle.Initialize() هي الطريقة الوحيدة المعتمدة في v2 وv3 من واجهة الإعداد
            Paddle.Environment.set('sandbox'); // بيئة تجريبية - احذف هذا السطر عند الانتقال للإنتاج الفعلي (live)

            Paddle.Initialize({
                token: 'test_2cc3d344a1d0e4e6d616fd1cafd' // استبدله بالتوكن الخاص بحسابك من Paddle Dashboard
            });

            document.getElementById('checkout-btn').addEventListener('click', function () {
                Paddle.Checkout.open({
                    items: [
                        {
                            priceId: 'pri_01kx2wv065vft9k5yn3r0xh3a4',
                            quantity: 1
                        }
                    ],
                    settings: {
                        displayMode: 'overlay',
                        theme: 'light',
                        locale: 'en'
                    }
                });
            });
        }
    </script>
</body>
</html>
