<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسح الذكي للمنيو ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #24b47e; --ai: #6c5ce7; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .upload-box { border: 2px dashed var(--ai); padding: 40px; border-radius: 15px; cursor: pointer; background: #f9f8ff; margin: 20px 0; }
        #loading { display: none; color: var(--ai); font-weight: bold; margin-top: 20px; }
        .hidden { display: none; }
        .btn { padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-primary { background: var(--primary); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: right; }
        input { width: 100%; border: 1px solid #ddd; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="step-1" class="card">
        <h2>📸 المسح الذكي للمنيو</h2>
        <p>ارفع صورة قائمة الطعام لاستخراج المنتجات تلقائياً</p>
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <span style="font-size: 50px; display: block;">📷</span>
            <span style="font-weight: bold; color: var(--ai);">اضغط للتصوير أو اختيار ملف</span>
        </div>
        <input type="file" id="file-input" class="hidden" accept="image/*">
        <div id="loading">جاري تحليل المنيو... انتظر قليلاً ⏳</div>
    </div>

    <div id="step-2" class="hidden">
        <div class="card">
            <h3>✅ مراجعة البيانات</h3>
            <table>
                <thead><tr><th>المنتج</th><th>السعر</th><th>التصنيف</th></tr></thead>
                <tbody id="result-body"></tbody>
            </table>
            <button class="btn btn-primary" id="save-btn">حفظ في قاعدة البيانات ✅</button>
            <button class="btn" style="background: #eee;" onclick="location.reload()">إلغاء</button>
        </div>
    </div>
</div>

<script type="importmap">
    { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
</script>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // المفتاح المأخوذ من صورتك الأخيرة
    const API_KEY = "AIzaSyAEz3LsCjAU4JHPFWt76vh37o3oCBeA3lA"; 
    const SB_URL = 'https://wnvyqvwuzmxzzhilgidh.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indudnlxdnd1em14enpoaWxnaWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTg1MDEsImV4cCI6MjA5MTQ5NDUwMX0.AyD4CYqA0cz9mC-bcOt16uUpueL_cAWT26Q92l574r0';

    const _supabase = supabase.createClient(SB_URL, SB_KEY);
    const storeId = new URLSearchParams(window.location.search).get('store_id');

    document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('loading').style.display = 'block';
        
        try {
            const genAI = new GoogleGenerativeAI(API_KEY);
            // استخدام اسم الموديل المستقر لتجنب خطأ الـ 404
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                
                const prompt = "Extract menu items as JSON: {\"items\": [{\"name\": \"\", \"price\": 0, \"cat\": \"\"}]}. Use Arabic.";
                
                const result = await model.generateContent([
                    { inlineData: { data: base64Data, mimeType: file.type } },
                    { text: prompt }
                ]);

                const text = result.response.text().replace(/```json|```/g, "").trim();
                const data = JSON.parse(text);
                displayResults(data.items);
            };
        } catch (err) {
            alert("خطأ: " + err.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    };

    function displayResults(items) {
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-2').classList.remove('hidden');
        const body = document.getElementById('result-body');
        body.innerHTML = items.map(item => `
            <tr>
                <td><input type="text" class="p-name" value="${item.name}"></td>
                <td><input type="number" class="p-price" value="${item.price}"></td>
                <td><input type="text" class="p-cat" value="${item.cat}"></td>
            </tr>`).join('');
    }

    document.getElementById('save-btn').onclick = async () => {
        const products = Array.from(document.querySelectorAll('#result-body tr')).map(row => ({
            product_name: row.querySelector('.p-name').value,
            price: parseFloat(row.querySelector('.p-price').value) || 0,
            store_id: storeId,
            is_available: true
        }));

        const { error } = await _supabase.from('products').insert(products);
        if (error) alert("خطأ سوبابيز: " + error.message);
        else alert("تم الحفظ بنجاح! 🎉");
    };
</script>
</body>
</html>
