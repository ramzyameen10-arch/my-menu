<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليل المنيو</title><style>
body {
    font-family: Arial;
    text-align: center;
    padding: 20px;
    background: #f7f7f7;
}

.box {
    border: 2px dashed #6c5ce7;
    padding: 30px;
    margin: 20px auto;
    width: 300px;
    border-radius: 15px;
    cursor: pointer;
    background: white;
}

.box:hover {
    background: #f0edff;
}

#loading {
    display: none;
    margin-top: 15px;
    font-weight: bold;
}

#result {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    text-align: right;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #6c5ce7;
    color: white;
    padding: 10px;
}

td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
}

.success { color: green; }
.error { color: red; }
</style></head><body><h2>📸 تحليل صورة المنيو</h2><div class="box" onclick="document.getElementById('file').click()">
    اضغط لرفع صورة
</div><input type="file" id="file" accept="image/*" style="display:none"><div id="loading">⏳ جاري التحليل...</div>
<div id="result"></div><script>
const FUNCTION_URL = "https://wnvyqvwuzmxzzhilgidh.supabase.co/functions/v1/analyze-image";

document.getElementById("file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("loading").style.display = "block";
    document.getElementById("result").innerHTML = "";

    try {
        const base64 = await toBase64(file);
        const base64Data = base64.split(",")[1];

        const res = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                imageBase64: base64Data,
                mimeType: file.type
            })
        });

        const data = await res.json();

        const text = JSON.stringify(data);
        const match = text.match(/\{[\s\S]*\}/);

        if (!match) throw new Error("لم يتم العثور على JSON");

        const parsed = JSON.parse(match[0]);

        displayResults(parsed.items || []);

    } catch (err) {
        document.getElementById("result").innerHTML =
            `<span class="error">❌ خطأ: ${err.message}</span>`;
    }

    document.getElementById("loading").style.display = "none";
});

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
    });
}

function displayResults(items) {
    if (!items.length) {
        document.getElementById("result").innerHTML =
            `<span class="error">❌ لم يتم العثور على بيانات</span>`;
        return;
    }

    let html = `<div class="success">✅ تم التحليل بنجاح</div><br>`;
    html += "<table>";
    html += "<tr><th>المنتج</th><th>السعر</th><th>التصنيف</th></tr>";

    items.forEach(item => {
        html += `
        <tr>
            <td>${escapeHtml(item.name)}</td>
            <td>${item.price || 0}</td>
            <td>${escapeHtml(item.category || "عام")}</td>
        </tr>`;
    });

    html += "</table>";

    document.getElementById("result").innerHTML = html;
}

function escapeHtml(text) {
    if (!text) return "";
    return text.replace(/[&<>]/g, (m) => {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
    });
}
</script></body>
</html>
