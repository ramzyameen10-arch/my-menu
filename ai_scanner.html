<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج المنيو الذكي 💡</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .upload-btn { background: #6c5ce7; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.3s; }
        .upload-btn:hover { background: #5b4bc4; }
        #loading { display: none; margin: 20px 0; color: #6c5ce7; font-weight: bold; }
        #output { 
            margin-top: 25px; 
            padding: 20px; 
            background: #2d3436; 
            color: #fab1a0; 
            border-radius: 10px; 
            text-align: right; 
            white-space: pre-wrap; 
            display: none;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 قارئ القوائم الذكي</h2>
    <p>ارفع صورة المنيو وسنقوم بتحويلها لنص فوراً</p>
    
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <button class="upload-btn" onclick="document.getElementById('imageInput').click()">إضافة صورة المنيو 📂</button>
    
    <div id="loading">⏳ جاري معالجة الصورة... انتظر قليلاً</div>
    
    <div id="output"></div>
</div>

<script>
    const API_URL = "https://wnvyqvwuzmxzzhilgidh.supabase.co/functions/v1/analyze-image";
    const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indudnlxdnd1em14enpoaWxnaWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTg1MDEsImV4cCI6MjA5MTQ5NDUwMX0.AyD4CYqA0cz9mC-bcOt16uUpueL_cAWT26Q92l574r0";

    document.getElementById('imageInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const loading = document.getElementById('loading');
        const output = document.getElementById('output');
        
        loading.style.display = 'block';
        output.style.display = 'none';

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const base64 = reader.result.split(',')[1];

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ANON_KEY}`
                    },
                    body: JSON.stringify({ image: base64 })
                });

                const resultText = await res.text();
                output.innerText = resultText;
                output.style.display = 'block';

            } catch (err) {
                output.innerText = "فشل الاتصال: " + err.message;
                output.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        };
    };
</script>

</body>
</html>
