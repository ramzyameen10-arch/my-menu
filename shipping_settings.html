<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الشحن والتوصيل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #24b47e; --primary-dark: #1a8f63; --primary-light: #e8f8f2;
            --danger: #e74c3c; --danger-light: #fdf2f2;
            --warning: #f39c12; --warning-light: #fef9ec;
            --blue: #2563eb; --blue-light: #eff6ff;
            --gray: #64748b; --gray-light: #f8fafc;
            --border: #e2e8f0; --text: #1e293b; --text-muted: #94a3b8;
            --bg: #f4f7f6; --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 14px; --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); direction: rtl; color: var(--text); min-height: 100vh; padding-bottom: 40px; }

        .top-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); }
        .btn-back-top { background: var(--gray-light); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--gray); display: flex; align-items: center; gap: 5px; }
        .btn-back-top:hover { background: #edf2f7; }
        .top-bar-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--text); }
        .store-badge { background: var(--primary-light); color: var(--primary-dark); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; border: 1px solid #b7e4cf; }

        .container { max-width: 560px; margin: auto; padding: 16px 12px; }

        .master-toggle-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
        .master-toggle-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .master-toggle-info { flex: 1; }
        .master-toggle-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
        .master-toggle-sub { font-size: 11px; color: var(--text-muted); }

        .toggle-switch { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
        .toggle-switch input { display: none; }
        .toggle-slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 28px; cursor: pointer; transition: 0.3s; }
        .toggle-slider::before { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: white; top: 3px; right: 3px; transition: 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(-24px); }

        .section-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
        .section-header { padding: 16px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; transition: background 0.2s; }
        .section-header:hover { background: var(--gray-light); }
        .section-header-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
        .section-header-text { flex: 1; }
        .section-header-title { font-size: 13px; font-weight: 700; color: var(--text); }
        .section-header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
        .section-chevron { color: var(--text-muted); font-size: 13px; transition: transform 0.25s; }
        .section-card.open .section-chevron { transform: rotate(180deg); }
        .section-body { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
        .section-card.open .section-body { display: block; }

        .methods-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
        .method-item { border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--gray-light); overflow: hidden; transition: border-color 0.2s; }
        .method-item.active-method { border-color: var(--primary); background: #fafffe; }
        .method-item-header { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
        .method-type-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
        .badge-free { background: #dcfce7; color: #166534; }
        .badge-flat { background: var(--blue-light); color: var(--blue); }
        .badge-custom { background: #fef3c7; color: #92400e; }
        .method-header-name { flex: 1; font-size: 13px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .method-item-actions { display: flex; align-items: center; gap: 8px; }
        .method-body { padding: 0 14px 14px; border-top: 1px solid var(--border); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .form-row.single { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-label { font-size: 11px; font-weight: 600; color: var(--gray); display: flex; align-items: center; gap: 4px; }
        .form-input { padding: 9px 11px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; color: var(--text); background: white; width: 100%; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(36,180,126,0.1); }
        .form-select { padding: 9px 11px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; color: var(--text); background: white; width: 100%; cursor: pointer; margin: 0; }
        .form-select:focus { outline: none; border-color: var(--primary); }

        /* ===== جدول المدن المحسّن ===== */
        .cities-section { margin-top: 14px; }
        .cities-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .cities-title { font-size: 12px; font-weight: 700; color: var(--text); }
        .btn-add-city { background: var(--primary-light); color: var(--primary-dark); border: 1px solid #b7e4cf; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-add-city:hover { background: #d4f0e5; }

        /* الشحن المجاني فوق مبلغ للنوع custom */
        .custom-free-over-box {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; margin-top: 10px; margin-bottom: 4px;
            background: var(--warning-light); border: 1px solid #fde68a;
            border-radius: var(--radius-sm);
        }
        .custom-free-over-label { font-size: 11px; font-weight: 600; color: #92400e; flex: 1; line-height: 1.4; }
        .custom-free-over-input { width: 100px; padding: 7px 8px; border: 1.5px solid #fcd34d; border-radius: 6px; font-size: 12px; direction: ltr; text-align: center; background: white; }
        .custom-free-over-input:focus { outline: none; border-color: var(--warning); }

        .cities-table { border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
        /* رأس الجدول: اسم المدينة | السعر | حذف */
        .cities-table-header {
            display: grid;
            grid-template-columns: 1fr 90px 30px;
            gap: 8px; padding: 7px 10px;
            background: var(--gray-light); border-bottom: 1.5px solid var(--border);
        }
        .cities-table-header span { font-size: 10px; font-weight: 700; color: var(--text-muted); }
        .cities-table-header .th-price { text-align: center; }
        .city-row {
            display: grid;
            grid-template-columns: 1fr 90px 30px;
            align-items: center; gap: 8px;
            padding: 8px 10px; border-bottom: 1px solid var(--border); background: white;
        }
        .city-row:last-child { border-bottom: none; }
        .city-row:nth-child(even) { background: #fafafa; }
        .city-input { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; width: 100%; background: transparent; }
        .city-input:focus { outline: none; border-color: var(--primary); background: white; }
        .city-price-input { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; width: 100%; direction: ltr; text-align: center; }
        .city-price-input:focus { outline: none; border-color: var(--primary); }
        .btn-remove-city { background: var(--danger-light); border: none; color: var(--danger); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-remove-city:hover { background: #fce8e8; }

        .action-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .btn-primary { flex: 1; padding: 11px; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { background: #b7e4cf; cursor: not-allowed; }
        .btn-add-method { width: 100%; padding: 12px; background: white; color: var(--primary); border: 2px dashed var(--primary); border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-add-method:hover { background: var(--primary-light); }

        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--white); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 12px 14px; text-align: center; }
        .stat-number { font-size: 22px; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        .empty-state { text-align: center; padding: 30px 20px; color: var(--text-muted); }
        .empty-state-icon { font-size: 36px; margin-bottom: 10px; }
        .empty-state-text { font-size: 13px; font-weight: 600; }
        .empty-state-sub { font-size: 11px; margin-top: 4px; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1e293b; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; z-index: 9999; transition: transform 0.3s; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--primary-dark); }
        .toast.error { background: var(--danger); }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 9998; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; color: var(--gray); font-weight: 600; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .dot-active { background: var(--primary); }
        .dot-inactive { background: var(--text-muted); }

        @media (max-width: 400px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .stat-number { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">جاري التحميل...</div>
</div>
<div class="toast" id="toast"></div>

<div class="top-bar">
    <button class="btn-back-top" onclick="goBack()">← رجوع</button>
    <div class="top-bar-title">🚚 الشحن والتوصيل</div>
    <div class="store-badge" id="store-name-badge">...</div>
</div>

<div class="container">

    <div class="stats-row" id="stats-row" style="display:none;">
        <div class="stat-card">
            <div class="stat-number" id="stat-methods">0</div>
            <div class="stat-label">طرق الشحن</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="stat-active">0</div>
            <div class="stat-label">مفعّلة</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="stat-cities">0</div>
            <div class="stat-label">مدينة مخدومة</div>
        </div>
    </div>

    <div class="master-toggle-card">
        <div class="master-toggle-icon">🚚</div>
        <div class="master-toggle-info">
            <div class="master-toggle-title">خدمة التوصيل</div>
            <div class="master-toggle-sub" id="delivery-status-text">تحميل...</div>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="master-toggle" onchange="saveMasterToggle()">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div id="shipping-content" style="display:none;">
        <div class="section-card open" id="section-methods">
            <div class="section-header" onclick="toggleSection('section-methods')">
                <div class="section-header-icon" style="background:#eff6ff;">📋</div>
                <div class="section-header-text">
                    <div class="section-header-title">طرق الشحن</div>
                    <div class="section-header-sub">أضف وعدّل طرق التوصيل المتاحة</div>
                </div>
                <span class="section-chevron">▼</span>
            </div>
            <div class="section-body">
                <div class="methods-list" id="methods-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <div class="empty-state-text">لا توجد طرق شحن بعد</div>
                        <div class="empty-state-sub">أضف طريقة شحن جديدة أدناه</div>
                    </div>
                </div>
                <button class="btn-add-method" onclick="addNewMethod()">+ إضافة طريقة شحن جديدة</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://wnvyqvwuzmxzzhilgidh.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indudnlxdnd1em14enpoaWxnaWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTg1MDEsImV4cCI6MjA5MTQ5NDUwMX0.AyD4CYqA0cz9mC-bcOt16uUpueL_cAWT26Q92l574r0';
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    const userPhone = (localStorage.getItem('user_phone') || '').trim();
    const urlParams = new URLSearchParams(window.location.search);
    const storeId   = parseInt(urlParams.get('store_id'));

    let storeData   = null;
    let methodsData = [];
    let toastTimer  = null;

    async function init() {
        if (!userPhone) { window.location.href = 'index.html'; return; }
        if (!storeId)   { showToast('معرّف المتجر غير موجود', 'error'); return; }
        try {
            const { data: profile } = await _supabase.from('profiles').select('id').eq('phone_number', userPhone).single();
            if (!profile) { window.location.href = 'index.html'; return; }

            const { data: store, error: storeErr } = await _supabase
                .from('store_settings').select('id, store_name, delivery_enabled')
                .eq('id', storeId).eq('user_id', profile.id).single();

            let storeRecord = store;
            if (storeErr || !store) {
                const { data: storeBasic, error: basicErr } = await _supabase
                    .from('store_settings').select('id, store_name')
                    .eq('id', storeId).eq('user_id', profile.id).single();
                if (basicErr || !storeBasic) {
                    showToast('⛔ غير مصرح بالوصول', 'error');
                    setTimeout(() => window.location.href = 'manage_stores.html', 2000);
                    return;
                }
                storeRecord = { ...storeBasic, delivery_enabled: false };
            }

            storeData = storeRecord;
            document.getElementById('store-name-badge').textContent = storeRecord.store_name;

            const enabled = storeRecord.delivery_enabled === true;
            document.getElementById('master-toggle').checked = enabled;
            updateDeliveryStatusText(enabled);
            if (enabled) {
                document.getElementById('shipping-content').style.display = 'block';
                document.getElementById('stats-row').style.display = 'grid';
            }
            await loadMethods();
        } catch(e) {
            showToast('خطأ في التحميل: ' + e.message, 'error');
        } finally {
            document.getElementById('loading-overlay').style.display = 'none';
        }
    }

    async function loadMethods() {
        const { data: methods, error } = await _supabase
            .from('shipping_methods').select('*, shipping_zones(*)')
            .eq('store_id', storeId).order('id', { ascending: true });
        if (error) { showToast('خطأ في تحميل الشحن', 'error'); return; }
        methodsData = (methods || []).map(m => ({ ...m, zones: m.shipping_zones || [], _dirty: false }));
        renderMethods();
        updateStats();
    }

    function renderMethods() {
        const list = document.getElementById('methods-list');
        if (methodsData.length === 0) {
            list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">لا توجد طرق شحن بعد</div><div class="empty-state-sub">أضف طريقة شحن جديدة أدناه</div></div>`;
            return;
        }
        list.innerHTML = methodsData.map((m, idx) => buildMethodHTML(m, idx)).join('');
    }

    function buildMethodHTML(m, idx) {
        const typeBadge = { free: 'badge-free', flat: 'badge-flat', custom: 'badge-custom' }[m.type] || 'badge-flat';
        const typeLabel = { free: 'مجاني', flat: 'سعر ثابت', custom: 'حسب المدينة' }[m.type] || m.type;

        let typeFields = '';

        if (m.type === 'flat') {
            typeFields = `
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">💰 سعر الشحن الثابت</label>
                        <input class="form-input" type="number" min="0" step="0.01" placeholder="0.00"
                            value="${m.base_price || 0}"
                            onchange="updateMethodField(${idx},'base_price',parseFloat(this.value)||0)">
                    </div>
                    <div class="form-group">
                        <label class="form-label">🎁 مجاني عند الطلب فوق</label>
                        <input class="form-input" type="number" min="0" step="0.01" placeholder="اتركه فارغاً لإلغائه"
                            value="${m.free_over_amount ?? ''}"
                            onchange="updateMethodField(${idx},'free_over_amount',this.value===''?null:parseFloat(this.value))">
                    </div>
                </div>`;

        } else if (m.type === 'free') {
            typeFields = `
                <div class="form-row single">
                    <div class="form-group">
                        <label class="form-label">🎁 مجاني عند الطلب فوق (اختياري)</label>
                        <input class="form-input" type="number" min="0" step="0.01" placeholder="اتركه فارغاً للمجاني دائماً"
                            value="${m.free_over_amount ?? ''}"
                            onchange="updateMethodField(${idx},'free_over_amount',this.value===''?null:parseFloat(this.value))">
                    </div>
                </div>`;

        } else if (m.type === 'custom') {
            typeFields = `
                <div class="custom-free-over-box">
                    <div class="custom-free-over-label">
                        🎁 شحن مجاني لجميع المدن عند الطلب فوق<br>
                        <span style="font-weight:400;color:#a16207;">(اتركه فارغاً لتطبيق سعر كل مدينة دائماً)</span>
                    </div>
                    <input class="custom-free-over-input" type="number" min="0" step="0.01"
                        placeholder="مثال: 200"
                        value="${m.free_over_amount ?? ''}"
                        onchange="updateMethodField(${idx},'free_over_amount',this.value===''?null:parseFloat(this.value))">
                    <span style="font-size:11px;color:#92400e;font-weight:700;">ريال</span>
                </div>
                <div class="cities-section">${buildZonesHTML(m, idx)}</div>`;
        }

        return `
        <div class="method-item ${m.is_active ? 'active-method' : ''}" id="method-card-${idx}">
            <div class="method-item-header">
                <span class="method-type-badge ${typeBadge}">${typeLabel}</span>
                <span class="method-header-name">${escHtml(m.name)}</span>
                <div class="method-item-actions">
                    <label class="toggle-switch" style="width:42px;height:24px;" title="${m.is_active?'إلغاء التفعيل':'تفعيل'}">
                        <input type="checkbox" ${m.is_active?'checked':''} onchange="toggleMethodActive(${idx})">
                        <span class="toggle-slider" style="border-radius:24px;"></span>
                    </label>
                    <button class="btn-remove-city" style="background:#fef2f2;" onclick="deleteMethod(${idx})" title="حذف">🗑</button>
                </div>
            </div>
            <div class="method-body">
                <div class="form-row single">
                    <div class="form-group">
                        <label class="form-label">✏️ اسم طريقة الشحن</label>
                        <input class="form-input" type="text" value="${escHtml(m.name)}"
                            placeholder="مثال: توصيل سريع، شحن عادي..."
                            onchange="updateMethodField(${idx},'name',this.value)">
                    </div>
                </div>
                <div class="form-row single">
                    <div class="form-group">
                        <label class="form-label">📦 نوع الشحن</label>
                        <select class="form-select" onchange="changeMethodType(${idx},this.value)">
                            <option value="flat"   ${m.type==='flat'   ?'selected':''}>💳 سعر ثابت</option>
                            <option value="free"   ${m.type==='free'   ?'selected':''}>🎁 مجاني</option>
                            <option value="custom" ${m.type==='custom' ?'selected':''}>🗺️ حسب المدينة/المنطقة</option>
                        </select>
                    </div>
                </div>
                ${typeFields}
                <div class="action-row">
                    <button class="btn-primary" onclick="saveMethod(${idx})">💾 حفظ</button>
                </div>
            </div>
        </div>`;
    }

    function buildZonesHTML(m, idx) {
        const zones = m.zones || [];
        const rows = zones.map((z, zi) => `
            <div class="city-row" id="zone-row-${idx}-${zi}">
                <input class="city-input" type="text" placeholder="اسم المدينة أو المنطقة"
                    value="${escHtml(z.city_name)}"
                    onchange="updateZoneField(${idx},${zi},'city_name',this.value)">
                <input class="city-price-input" type="number" min="0" step="0.01" placeholder="السعر"
                    value="${z.price ?? 0}"
                    onchange="updateZoneField(${idx},${zi},'price',parseFloat(this.value)||0)">
                <button class="btn-remove-city" onclick="removeZone(${idx},${zi})">✕</button>
            </div>`).join('');

        return `
            <div class="cities-header">
                <span class="cities-title">🏙️ المدن والأسعار</span>
                <button class="btn-add-city" onclick="addZone(${idx})">+ إضافة مدينة</button>
            </div>
            <div class="cities-table" id="zones-table-${idx}">
                <div class="cities-table-header">
                    <span>المدينة / المنطقة</span>
                    <span class="th-price">السعر</span>
                    <span></span>
                </div>
                ${rows || `<div style="padding:14px;text-align:center;font-size:12px;color:var(--text-muted);">لا توجد مدن — اضغط + لإضافة</div>`}
            </div>`;
    }

    function updateStats() {
        const total  = methodsData.length;
        const active = methodsData.filter(m => m.is_active).length;
        const cities = methodsData.reduce((sum, m) => sum + (m.zones?.length || 0), 0);
        document.getElementById('stat-methods').textContent = total;
        document.getElementById('stat-active').textContent  = active;
        document.getElementById('stat-cities').textContent  = cities;
    }

    function toggleSection(id) { document.getElementById(id).classList.toggle('open'); }

    async function saveMasterToggle() {
        const enabled = document.getElementById('master-toggle').checked;
        try {
            const { error } = await _supabase.from('store_settings').update({ delivery_enabled: enabled }).eq('id', storeId);
            if (error) {
                showToast('⚠️ تأكد من تنفيذ: ALTER TABLE store_settings ADD COLUMN delivery_enabled BOOLEAN DEFAULT FALSE', 'error');
                document.getElementById('master-toggle').checked = !enabled;
                return;
            }
            updateDeliveryStatusText(enabled);
            document.getElementById('shipping-content').style.display = enabled ? 'block' : 'none';
            document.getElementById('stats-row').style.display = enabled ? 'grid' : 'none';
            if (enabled) await loadMethods();
            showToast(enabled ? '✅ تم تفعيل خدمة التوصيل' : '⛔ تم إيقاف خدمة التوصيل', enabled ? 'success' : '');
        } catch(e) { showToast('فشل الحفظ: ' + e.message, 'error'); }
    }

    function updateDeliveryStatusText(enabled) {
        document.getElementById('delivery-status-text').innerHTML = enabled
            ? '<span class="status-dot dot-active"></span> مفعّلة — الزبائن يمكنهم اختيار التوصيل'
            : '<span class="status-dot dot-inactive"></span> معطّلة — خدمة التوصيل غير متاحة حالياً';
    }

    function toggleMethodActive(idx) {
        methodsData[idx].is_active = !methodsData[idx].is_active;
        document.getElementById(`method-card-${idx}`).classList.toggle('active-method', methodsData[idx].is_active);
        updateStats();
    }

    function changeMethodType(idx, newType) {
        methodsData[idx].type = newType;
        if (newType !== 'custom') methodsData[idx].zones = [];
        renderMethods();
    }

    function updateMethodField(idx, field, value) { methodsData[idx][field] = value; }

    function addZone(idx) {
        methodsData[idx].zones = methodsData[idx].zones || [];
        methodsData[idx].zones.push({ city_name: '', price: 0, _new: true });
        renderMethods();
        setTimeout(() => {
            const lastRow = document.querySelector(`#zones-table-${idx} .city-row:last-child input`);
            if (lastRow) lastRow.focus();
        }, 50);
    }

    function removeZone(idx, zi) { methodsData[idx].zones.splice(zi, 1); renderMethods(); updateStats(); }

    function updateZoneField(idx, zi, field, value) {
        methodsData[idx].zones[zi][field] = value;
        if (field === 'city_name') updateStats();
    }

    function addNewMethod() {
        methodsData.push({ id: null, store_id: storeId, name: 'طريقة توصيل جديدة', type: 'flat', base_price: 0, free_over_amount: null, is_active: true, zones: [], _new: true });
        renderMethods(); updateStats();
        setTimeout(() => {
            const cards = document.querySelectorAll('.method-item');
            if (cards.length) cards[cards.length-1].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    async function saveMethod(idx) {
        const m = methodsData[idx];
        if (!m.name.trim()) { showToast('يرجى إدخال اسم طريقة الشحن', 'error'); return; }
        const btn = document.querySelector(`#method-card-${idx} .btn-primary`);
        btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';
        try {
            const payload = {
                store_id: storeId, name: m.name.trim(), type: m.type,
                base_price: m.base_price || 0,
                free_over_amount: m.free_over_amount || null,
                is_active: m.is_active, updated_at: new Date().toISOString()
            };
            let methodId = m.id;
            if (!methodId) {
                const { data: inserted, error } = await _supabase.from('shipping_methods').insert([payload]).select().single();
                if (error) throw error;
                methodId = inserted.id; methodsData[idx].id = methodId; methodsData[idx]._new = false;
            } else {
                const { error } = await _supabase.from('shipping_methods').update(payload).eq('id', methodId);
                if (error) throw error;
            }
            if (m.type === 'custom') {
                await saveZones(idx, methodId);
            } else {
                await _supabase.from('shipping_zones').delete().eq('shipping_method_id', methodId);
                methodsData[idx].zones = [];
            }
            showToast('✅ تم حفظ طريقة الشحن', 'success');
            await loadMethods();
        } catch(e) {
            showToast('فشل الحفظ: ' + e.message, 'error');
            btn.disabled = false; btn.textContent = '💾 حفظ';
        }
    }

    async function saveZones(idx, methodId) {
        const zones = methodsData[idx].zones || [];
        await _supabase.from('shipping_zones').delete().eq('shipping_method_id', methodId);
        const validZones = zones.filter(z => z.city_name && z.city_name.trim());
        if (validZones.length === 0) return;
        const rows = validZones.map(z => ({ shipping_method_id: methodId, city_name: z.city_name.trim(), price: parseFloat(z.price) || 0 }));
        const { error } = await _supabase.from('shipping_zones').insert(rows);
        if (error) throw error;
    }

    async function deleteMethod(idx) {
        const m = methodsData[idx];
        if (!confirm(`⚠️ حذف "${m.name}"؟\nسيتم حذف جميع أسعار المدن المرتبطة بها.`)) return;
        if (m.id) {
            const { error } = await _supabase.from('shipping_methods').delete().eq('id', m.id);
            if (error) { showToast('فشل الحذف: ' + error.message, 'error'); return; }
        }
        methodsData.splice(idx, 1); renderMethods(); updateStats();
        showToast('🗑 تم حذف طريقة الشحن', '');
    }

    function escHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function showToast(msg, type = '') {
        const el = document.getElementById('toast');
        el.textContent = msg; el.className = 'toast ' + type; el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
    }

    // ✅ التعديل: الرجوع للصفحة السابقة بدل صفحة محددة
    function goBack() { history.back(); }

    init();
</script>
</body>
</html>
