<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الملف الشخصي | منصة القوائم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #24b47e; --dark: #2f3542; --bg: #f4f7f6; --edit: #3498db; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        h2 { margin: 0; color: var(--dark); font-size: 1.4em; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .profile-preview-wrapper { text-align: center; margin-bottom: 25px; position: relative; }
        .profile-avatar-circle {
            width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
            border: 4px solid var(--primary); background: #eee;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; position: relative; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .profile-avatar-circle:hover { transform: scale(1.03); box-shadow: 0 6px 14px rgba(36, 180, 126, 0.25); }
        .profile-avatar-circle:active { transform: scale(0.98); }
        .profile-avatar-circle img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; min-width: 100%; min-height: 100%; pointer-events: none; }
        .camera-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%; background: rgba(0,0,0,0.35);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .profile-avatar-circle:hover .camera-overlay { opacity: 1; }
        .camera-overlay span { color: white; font-size: 28px; }
        .avatar-label { margin-top: 10px; font-size: 13px; color: #888; font-weight: 600; }
        #file-input { display: none; }
        #upload-status { font-size: 12px; color: var(--primary); margin-top: 8px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--dark); }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 5px rgba(36, 180, 126, 0.2); }
        input:disabled { background: #f0f0f0; cursor: not-allowed; color: #777; }
        .field-required-wrapper { position: relative; margin-bottom: 20px; }
        .field-required-wrapper input { margin: 0; border-color: #e74c3c; border-width: 1.5px; }
        .field-required-wrapper input:focus { outline: none; border-color: #c0392b; box-shadow: 0 0 0 3px rgba(231,76,60,0.12); }
        .field-required-wrapper input.valid { border-color: var(--primary); }
        .field-required-wrapper input.valid:focus { box-shadow: 0 0 0 3px rgba(36,180,126,0.12); }
        .required-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #e74c3c; font-weight: 600; margin-bottom: 3px; }
        .required-label span.dot { width: 6px; height: 6px; background: #e74c3c; border-radius: 50%; display: inline-block; }
        .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; display: block; text-decoration: none; text-align: center; }
        .btn-save { background: var(--primary); color: white; }
        .btn-back { background: #34495e; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    </style>
<base target="_blank">
<base target="_blank">
</head>
<body>

<div class="container">
    <div class="header">
        <h2>إعدادات الملف الشخصي</h2>
        <button class="btn" style="width: auto; padding: 8px 15px; margin: 0; font-size: 13px; background: #34495e; color: white;" onclick="window.history.back()">رجوع</button>
    </div>

    <div class="card">
        <div class="profile-preview-wrapper">
            <div class="profile-avatar-circle" onclick="document.getElementById('file-input').click()">
                <img id="img-preview" src="https://via.placeholder.com/120" alt="الصورة الشخصية">
                <div class="camera-overlay"><span>📷</span></div>
            </div>
            <div class="avatar-label">الصورة الشخصية</div>
            <input type="file" id="file-input" accept="image/*" onchange="uploadImage(this)">
            <div id="upload-status" style="display: none;"></div>
        </div>

        <input type="hidden" id="internal_user_id">
        <input type="hidden" id="profile_img_url_hidden">

        <div class="field-required-wrapper">
            <div class="required-label"><span class="dot"></span> اسم المستخدم (مطلوب)</div>
            <input type="text" id="username" placeholder="مثال: رمزي أمين" oninput="validateRequired(this)">
        </div>

        <div class="form-group">
            <label>رقم الهاتف (للتوثيق فقط)</label>
            <input type="text" id="phone_display" disabled>
        </div>

        <button id="save-btn" class="btn btn-save" onclick="updateProfile()">حفظ</button>
        <button class="btn btn-back" onclick="window.history.back()">إلغاء</button>
    </div>
</div>

<script>
// ============================================================
// ⚠️ مهم: لا تفتح هذا الملف مباشرة من file:/// 
//        لأن المتصفح يمنع بعض العمليات الأمنية (CORS).
//        استخدم سيرفر محلي مثل Live Server في VS Code.
// ============================================================
const SB_URL = 'https://wnvyqvwuzmxzzhilgidh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indudnlxdnd1em14enpoaWxnaWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTg1MDEsImV4cCI6MjA5MTQ5NDUwMX0.AyD4CYqA0cz9mC-bcOt16uUpueL_cAWT26Q92l574r0';

// ✅ عميل Supabase واحد فقط (يُنشأ بعد التحقق من التوكن)
//    هذا يمنع تنبيه GoTrueClient الأصفر.
let _supabaseAuthed = null;

let currentUser = null;
let userPhone = '';

// ============================================================
// ✅ نظام المصادقة (JWT Token) - عميل واحد فقط
// ============================================================
async function checkAuth() {
    const token = localStorage.getItem('auth_token');
    if (!token) {
        window.location.href = "index.html";
        return null;
    }
    try {
        const response = await fetch('https://wnvyqvwuzmxzzhilgidh.supabase.co/functions/v1/verify-token', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token })
        });
        const result = await response.json();
        if (!result.valid) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_phone');
            localStorage.removeItem('user_phone_display');
            localStorage.removeItem('is_logged_in');
            window.location.href = "index.html";
            return null;
        }
        // ✅ عميل واحد فقط مع التوكن — يمنع تنبيه GoTrueClient الأصفر
        _supabaseAuthed = supabase.createClient(SB_URL, SB_KEY, {
            global: { headers: { Authorization: `Bearer ${token}` } }
        });
        return result.user;
    } catch (err) {
        console.error('Auth check failed:', err);
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user_phone');
        localStorage.removeItem('user_phone_display');
        localStorage.removeItem('is_logged_in');
        window.location.href = "index.html";
        return null;
    }
}

function logout() {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user_phone');
    localStorage.removeItem('user_phone_display');
    localStorage.removeItem('is_logged_in');
    window.location.href = "index.html";
}

async function init() {
    const user = await checkAuth();
    if (!user) return;
    currentUser = user;
    userPhone = user.phone || '';
    if (userPhone) localStorage.setItem('user_phone', userPhone);
    await loadUserData();
}

function validateRequired(input) {
    input.classList.toggle('valid', !!input.value.trim());
}

async function loadUserData() {
    try {
        const { data, error } = await _supabaseAuthed
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .maybeSingle();

        if (error) throw error;

        if (data) {
            document.getElementById('internal_user_id').value = data.id;
            document.getElementById('username').value = data.username || '';
            document.getElementById('phone_display').value = data.phone_number || '';
            document.getElementById('profile_img_url_hidden').value = data.profile_img_url || '';

            if (data.profile_img_url) {
                document.getElementById('img-preview').src = data.profile_img_url;
            }
            if (data.username) {
                document.getElementById('username').classList.add('valid');
            }
        } else {
            alert("لم يتم العثور على سجل بروفايل لهذا المستخدم.");
        }
    } catch (err) {
        console.error("Fetch Error:", err.message);
    }
}

async function uploadImage(input) {
    const file = input.files[0];
    if (!file) return;

    const statusLabel = document.getElementById('upload-status');
    statusLabel.style.display = "block";
    statusLabel.innerText = "⏳ جاري رفع الصورة...";
    statusLabel.style.color = "var(--edit)";

    try {
        const fileExt = file.name.split('.').pop();
        const fileName = `avatar_${Date.now()}.${fileExt}`;

        const { data, error } = await _supabaseAuthed.storage
            .from('avatars')
            .upload(fileName, file);

        if (error) throw error;

        const { data: urlData } = _supabaseAuthed.storage.from('avatars').getPublicUrl(fileName);
        const publicUrl = urlData.publicUrl;

        document.getElementById('img-preview').src = publicUrl;
        document.getElementById('profile_img_url_hidden').value = publicUrl;

        statusLabel.innerText = "✅ تم الرفع بنجاح";
        statusLabel.style.color = "var(--primary)";
    } catch (err) {
        alert("خطأ أثناء الرفع: " + err.message);
        statusLabel.innerText = "❌ فشل الرفع";
        statusLabel.style.color = "var(--danger)";
    }
}

async function updateProfile() {
    const saveBtn = document.getElementById('save-btn');
    const targetUuid = document.getElementById('internal_user_id').value;
    const newUsername = document.getElementById('username').value.trim();
    const newImageUrl = document.getElementById('profile_img_url_hidden').value;

    if (!targetUuid) {
        alert("خطأ: لم يتم تحميل معرف المستخدم. يرجى إعادة تحميل الصفحة.");
        return;
    }

    if (!newUsername) {
        alert("⚠️ اسم المستخدم مطلوب. يرجى إدخال اسم المستخدم.");
        document.getElementById('username').focus();
        return;
    }

    saveBtn.disabled = true;
    saveBtn.innerText = "⏳ جاري حفظ البيانات...";

    try {
        const { data, error } = await _supabaseAuthed
            .from('profiles')
            .update({ username: newUsername, profile_img_url: newImageUrl })
            .eq('id', targetUuid)
            .select();

        if (error) throw error;

        if (data && data.length > 0) {
            alert("🎉 تم تحديث ملفك الشخصي بنجاح");
            window.location.href = "dashboard.html";
        } else {
            alert("لم يتم إجراء أي تغييرات. تأكد من الصلاحيات.");
        }
    } catch (err) {
        alert("فشل التحديث: " + err.message);
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "حفظ";
    }
}

init();
</script>

</body>
</html>
